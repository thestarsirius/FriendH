<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>إلى حنان 🤍</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#111;font-family:Tajawal,sans-serif;overflow:hidden}
#app{position:relative;width:100%;max-width:480px;height:100dvh;margin:auto;overflow:hidden;color:#fff}
.sky{position:absolute;inset:0;opacity:0;transition:opacity 2s}
.sky.on{opacity:1}
#s0{background:linear-gradient(#ffb3cc,#ffe3c2)}
#s1{background:linear-gradient(#6a3b9e,#ff6f91 55%,#ffa45c)}
#s2{background:linear-gradient(#4a9bff,#d3eaff)}
#s3{background:linear-gradient(#0a0a38,#24246e)}
.sun{position:absolute;border-radius:50%;transition:all 2.4s;box-shadow:0 0 60px 10px #fff6;width:90px;height:90px;left:6%;top:68%;background:#ffe08a;opacity:.9}
[data-s="1"] .sun{left:74%;top:56%;background:#ff9f43}
[data-s="2"] .sun{left:68%;top:7%;background:#ffe27a;width:110px;height:110px}
[data-s="3"] .sun{left:50%;top:3%;margin-left:-50px;background:#fff1c1;width:100px;height:100px;box-shadow:0 0 70px 20px #fff3}
.cl{position:absolute;width:120px;height:36px;background:#fff;border-radius:40px;opacity:.85;transition:opacity 2s;animation:dr 30s ease-in-out infinite alternate}
.cl:before,.cl:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cl:before{width:54px;height:54px;top:-26px;left:18px}.cl:after{width:40px;height:40px;top:-18px;left:62px}
[data-s="3"] .cl{opacity:.12}
@keyframes dr{to{transform:translateX(50px)}}
.st{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;opacity:0;transition:opacity 2s}
[data-s="3"] .st{opacity:.9;animation:tw 3s infinite alternate}
@keyframes tw{50%{opacity:.25}}
#title{position:absolute;top:13%;left:0;right:0;text-align:center;font-family:'Aref Ruqaa',serif;color:#8a3b6e;transition:opacity 1s;z-index:3}
#title b{display:block;font-size:56px;text-shadow:0 0 18px #fff}#title span{font-size:24px;opacity:.9}
#line{position:absolute;top:calc(env(safe-area-inset-top) + 6px);left:0;right:0;height:60px;display:flex;justify-content:center;gap:12px;z-index:4}
#line:before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:#fff9}
.th{position:relative;width:44px;height:50px;background:#fff;padding:3px;border-radius:2px;margin-top:4px;box-shadow:0 3px 8px #0006;animation:pop .6s both}
.th img{width:100%;height:36px;object-fit:cover;display:block}
.th:before{content:"";position:absolute;top:-6px;left:50%;width:7px;height:14px;margin-left:-3px;background:#ff8a3d;border-radius:2px}
.th:nth-child(odd){transform:rotate(-4deg)}.th:nth-child(even){transform:rotate(3deg)}
@keyframes pop{from{opacity:0;scale:2}}
#stage{overflow-y:auto;position:absolute;top:70px;left:0;right:0;bottom:170px;display:flex;flex-direction:column;align-items:center;padding:6px 20px;z-index:2}
.pol{width:min(72vw,290px);background:#fff;padding:10px 10px 8px;border-radius:5px;box-shadow:0 14px 34px #0006;transform:rotate(3deg);animation:in 1s both}
.pol img{width:100%;height:min(26vh,220px);object-fit:cover;display:block;filter:blur(16px);animation:dev 2.4s .3s forwards}
.pol h3{font:700 23px 'Aref Ruqaa',serif;color:#2a2147;text-align:center;padding:10px 0 4px}
@keyframes in{from{opacity:0;transform:translateY(220px) scale(.4) rotate(-8deg)}}
@keyframes dev{to{filter:blur(0)}}
.pol.fly{transition:all .8s;transform:translateY(-300px) scale(.12);opacity:0}
.tx{width:100%;max-width:330px;margin-top:14px;padding:14px 18px;background:#0005;border:1px solid #fff3;border-radius:16px;font-size:15.5px;line-height:2;min-height:70px;backdrop-filter:blur(3px);transition:background 2s}
[data-s="1"] .tx{background:#3a1030aa}[data-s="2"] .tx{background:#1d3566aa}[data-s="3"] .tx{background:#0a0a30cc}
#hint{position:absolute;bottom:138px;left:0;right:0;text-align:center;font:700 20px Tajawal;color:#fff;text-shadow:0 2px 8px #0005;opacity:0;transition:opacity 1s;z-index:3}
#hint.on{opacity:.85;animation:bl 2s infinite alternate}
@keyframes bl{to{opacity:.4}}
#cam{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:50%;width:152px;height:106px;margin-left:-76px;background:#fdebd5;border:4px solid #3a2556;border-radius:16px;z-index:5;cursor:pointer;box-shadow:0 8px 22px #0005;transition:transform .15s}
#cam:active{transform:scale(.94)}
#cam:before{content:"";position:absolute;top:-12px;left:50%;width:70px;height:10px;margin-left:-35px;background:#3a2556;border-radius:6px 6px 0 0}
.bd{position:absolute;top:0;left:0;right:0;height:14px;background:linear-gradient(90deg,#ff6f91 25%,#f6a93b 25% 50%,#3ec28f 50% 75%,#4a8df0 75%);border-radius:10px 10px 0 0}
.ln{position:absolute;top:26px;left:50%;width:64px;height:64px;margin-left:-32px;border-radius:50%;background:#2a2147;display:grid;place-items:center}
.ln i{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 4px,#3d8df0 5px);display:block}
.fl{position:absolute;top:22px;left:12px;width:22px;height:12px;border:3px solid #3a2556;border-radius:4px;background:#fff6c8}
.bt{position:absolute;top:20px;right:12px;width:16px;height:16px;border-radius:50%;background:#ff4f87;border:3px solid #3a2556}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9}
#flash.on{animation:fa .5s}
@keyframes fa{0%{opacity:.9}100%{opacity:0}}
svg{width:100%;max-width:340px;overflow:visible}
.cn{fill:none;stroke:#ffd45e;stroke-width:3;stroke-dasharray:700;stroke-dashoffset:700;animation:dw 3s forwards}
.ar{fill:none;stroke:#ff8fb1;stroke-width:3;stroke-dasharray:6 7;opacity:0;animation:ap 1s 3s forwards}
@keyframes dw{to{stroke-dashoffset:0}}@keyframes ap{to{opacity:1}}
svg text{font:700 22px 'Aref Ruqaa',serif;fill:#fff}
#go{position:absolute;bottom:136px;left:50%;transform:translateX(-50%);z-index:6;font:700 19px Tajawal;color:#fff;border:0;border-radius:40px;padding:13px 34px;background:linear-gradient(90deg,#ff5f9e,#7c5cff);box-shadow:0 8px 22px #0006;display:none;white-space:nowrap}
#go.on{display:block;animation:in2 .8s both}
@keyframes in2{from{opacity:0;transform:translateX(-50%) translateY(20px)}}
.h{position:absolute;font-size:26px;z-index:20;pointer-events:none;animation:up 2.4s forwards}
@keyframes up{to{transform:translateY(-75vh) scale(1.6);opacity:0}}
.sp{position:absolute;font-size:20px;pointer-events:none;z-index:8;animation:spk 1.2s forwards}
@keyframes spk{to{transform:translate(var(--dx),var(--dy)) rotate(220deg) scale(.3);opacity:0}}
.fh{position:absolute;bottom:-30px;pointer-events:none;z-index:1;opacity:0;font-size:var(--z);animation:fh var(--d) linear forwards}
@keyframes fh{10%{opacity:.75}to{transform:translateY(-110vh) translateX(var(--w));opacity:0}}
.shoot{position:absolute;width:120px;height:2px;background:linear-gradient(90deg,#fff,transparent);opacity:0;z-index:1}
[data-s="3"] .shoot{animation:sh 7s infinite}
@keyframes sh{0%{opacity:0;transform:translate(0,0) rotate(28deg)}2%{opacity:1}11%{opacity:0;transform:translate(-280px,150px) rotate(28deg)}100%{opacity:0}}
.ff{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffe27a;box-shadow:0 0 12px 4px #ffe27a99;opacity:0;transition:opacity 2s;animation:fl 8s ease-in-out infinite alternate;z-index:1}
[data-s="3"] .ff{opacity:.9}@keyframes fl{to{transform:translate(40px,-70px)}}
.pol{animation:in 1s both,sw 5s 2.4s ease-in-out infinite alternate}@keyframes sw{from{transform:rotate(3deg)}to{transform:rotate(-2deg) translateY(-5px)}}
.pol.fly{animation:none}
.tx{animation:gl 3s infinite alternate}@keyframes gl{to{box-shadow:0 0 18px #fff4}}
.th{animation:pop .6s both,sy 4s .6s ease-in-out infinite alternate}@keyframes sy{to{rotate:5deg}}
#cam{animation:wig 3.4s infinite}@keyframes wig{0%,84%,100%{rotate:0deg}89%{rotate:-4deg}94%{rotate:4deg}}
</style>
</head>
<body>
<div id="app" data-s="0">
<div class="sky on" id="s0"></div><div class="sky" id="s1"></div><div class="sky" id="s2"></div><div class="sky" id="s3"></div>
<div class="sun"></div>
<div class="cl" style="top:5%;left:-20px"></div><div class="cl" style="top:34%;left:62%;animation-duration:24s"></div><div class="cl" style="top:52%;left:12%;animation-duration:36s"></div>
<div id="title"><b>إلى حنان</b><span>من شهد 🤍</span></div>
<div id="line"></div>
<div id="stage"></div>
<div id="hint" class="on">اضغطي على الكاميرا لتلتقطي أول ذكرى</div>
<button id="go">وصلت نجمتك ★</button>
<div id="cam"><div class="bd"></div><div class="fl"></div><div class="bt"></div><div class="ln"><i></i></div></div>
<div id="flash"></div>
</div>

function burst(){const r=$('cam').getBoundingClientRect(),a=app.getBoundingClientRect();for(let n=0;n<16;n++){const s=document.createElement('div');s.className='sp';s.textContent=['✦','✨','💗','⭐'][n%4];s.style.cssText=`left:${r.left-a.left+r.width/2}px;top:${r.top-a.top}px;--dx:${Math.random()*300-150}px;--dy:${-60-Math.random()*300}px`;app.appendChild(s);setTimeout(()=>s.remove(),1300)}}
function rise(){if(hh)return;hh=setInterval(()=>{const h=document.createElement('div');h.className='fh';h.textContent=['♥','🌸','✨','♡'][Math.random()*4|0];h.style.cssText=`left:${Math.random()*92}%;--z:${14+Math.random()*16}px;--d:${7+Math.random()*5}s;--w:${Math.random()*80-40}px;color:#ffc2da`;app.appendChild(h);setTimeout(()=>h.remove(),12500)},1500)}

function sky(s){app.dataset.s=s;document.querySelectorAll('.sky').forEach((e,j)=>e.classList.toggle('on',j==s))}
function type(el,t,done){let j=0;el.textContent='';clearInterval(tm);const end=()=>{clearInterval(tm);fin=null;el.textContent=t;done()};fin=end;tm=setInterval(()=>{el.textContent=t.slice(0,++j);if(j>=t.length)end()},32);el.onclick=()=>fin&&fin()}
function hang(){if(!cur)return;const m=M[k-1],p=cur;p.classList.add('fly');setTimeout(()=>{const d=document.createElement('div');d.className='th';d.innerHTML=`<img src="${I[m.i]}" style="object-position:${m.pos}">`;$('line').appendChild(d)},500);}

  }
  st.appendChild(box);
  type(box,m.x,()=>{k++;busy=0;if(k<M.length){$('hint').textContent='اضغطي لتلتقطي الذكرى التالية';$('hint').classList.add('on')}else{$('go').classList.add('on')}});
